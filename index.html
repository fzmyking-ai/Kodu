        // =====================================================================
        // COMPRESSÃO / UPLOAD DE IMAGENS E ARQUIVOS
        // =====================================================================
        function handleImageUpload(inputEle, itemIndex, blockIndex, catKey) {
            catKey = catKey || currentCategory;
            const files = inputEle.files;
            if (files.length === 0) return;
            pushUndo();

            let base64Strings = [];
            let filesProcessed = 0;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const isPng = file.type === 'image/png';
                        base64Strings.push(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', isPng ? 1.0 : 0.7));
                        filesProcessed++;

                        if (filesProcessed === files.length) {
                            const existing = itemsOf(catKey)[itemIndex].blocks[blockIndex].value;
                            const newVal = existing ? existing + '\n' + base64Strings.join('\n') : base64Strings.join('\n');

                            updateBlockValue(itemIndex, blockIndex, newVal, catKey);
                            playSound('success');
                            render();
                        }
                    }
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function handleFileUpload(inputEle, itemIndex, blockIndex, catKey) {
            catKey = catKey || currentCategory;
            const files = inputEle.files;
            if (files.length === 0) return;
            pushUndo();

            let fileStrings = [];
            let filesProcessed = 0;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    fileStrings.push(`${file.name}|||${e.target.result}`);
                    filesProcessed++;

                    if (filesProcessed === files.length) {
                        const existing = itemsOf(catKey)[itemIndex].blocks[blockIndex].value;
                        const newVal = existing ? existing + '\n' + fileStrings.join('\n') : fileStrings.join('\n');
                        updateBlockValue(itemIndex, blockIndex, newVal, catKey);
                        playSound('success');
                        render();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function handleDateInput(inputEle, itemIndex, blockIndex, catKey) {
            let val = inputEle.value.replace(/\D/g, '');
            if (val.length >= 2) val = val.substring(0, 2) + '/' + val.substring(2, 4);
            inputEle.value = val;
            updateBlockValue(itemIndex, blockIndex, val, catKey);
        }

        function handleListTextarea(event, ele, itemIndex, blockIndex, catKey) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const start = ele.selectionStart;
                const end = ele.selectionEnd;
                const value = ele.value;

                const newText = value.substring(0, start) + "\n- " + value.substring(end);
                ele.value = newText;

                ele.selectionStart = ele.selectionEnd = start + 3;
                updateBlockValue(itemIndex, blockIndex, newText, catKey);
            }
        }

        // =====================================================================
        // ⏰ NOTIFICAÇÕES (banner interno + Notification API real)
        // =====================================================================
        function getDeadlineDiff(dateStr) {
            if (!dateStr || !dateStr.includes('/')) return null;
            const partes = dateStr.split('/');
            if (partes.length < 2 || partes[1].length !== 2) return null;
            const dia = parseInt(partes[0]);
            const mes = parseInt(partes[1]);
            if (isNaN(dia) || isNaN(mes)) return null;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const dataLimite = new Date(hoje.getFullYear(), mes - 1, dia);
            return Math.round((dataLimite - hoje) / (1000 * 3600 * 24));
        }

        function checkNotifications() {
            let temAviso = false;
            let dueTitles = [];

            Object.keys(database).forEach(catKey => {
                itemsOf(catKey).forEach(item => {
                    const titleBlock = item.blocks.find(b => b.type === 'titulo');
                    item.blocks.forEach(block => {
                        if (block.type === 'data') {
                            const diff = getDeadlineDiff(block.value);
                            if (diff === 0 || diff === 1) {
                                temAviso = true;
                                dueTitles.push(titleBlock ? titleBlock.value : 'Grupo sem título');
                            }
                        }
                    });
                });
            });

            document.getElementById('notification').style.display = temAviso ? 'flex' : 'none';

            if (temAviso && 'Notification' in window && Notification.permission === 'granted') {
                const todayKey = new Date().toDateString();
                if (localStorage.getItem('painel_last_notif_date') !== todayKey) {
                    localStorage.setItem('painel_last_notif_date', todayKey);
                    new Notification('⏰ Prazos no Painel Modular', {
                        body: dueTitles.slice(0, 3).join(', ') + (dueTitles.length > 3 ? '...' : '')
                    });
                }
            }
        }

        // =====================================================================
        // 📊 ESTATÍSTICAS
        // =====================================================================
        function openStats() {
            playSound('click');
            let totalGroups = 0, totalTasks = 0, doneTasks = 0, overdue = 0, favCount = 0;

            Object.keys(database).forEach(catKey => {
                if (catKey.startsWith('//')) return;
                itemsOf(catKey).forEach(item => {
                    totalGroups++;
                    if (item.favorite) favCount++;
                    item.blocks.forEach(block => {
                        if (block.type === 'checklist') {
                            const list = parseChecklist(block.value);
                            totalTasks += list.length;
                            doneTasks += list.filter(t => t.done).length;
                        }
                        if (block.type === 'data') {
                            const diff = getDeadlineDiff(block.value);
                            if (diff !== null && diff < 0) overdue++;
                        }
                    });
                });
            });

            Swal.fire({
                title: '<i class="fas fa-chart-simple"></i> Estatísticas',
                html: `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px;">
                        <div class="stat-card"><div class="num">${totalGroups}</div><div class="lbl">Grupos totais</div></div>
                        <div class="stat-card"><div class="num">${favCount}</div><div class="lbl">Favoritos</div></div>
                        <div class="stat-card"><div class="num">${doneTasks}/${totalTasks}</div><div class="lbl">Tarefas concluídas</div></div>
                        <div class="stat-card" style="color:var(--error-color);"><div class="num" style="color:var(--error-color);">${overdue}</div><div class="lbl">Prazos vencidos</div></div>
                    </div>
                `,
                confirmButtonText: 'Fechar',
                confirmButtonColor: 'var(--primary-color)'
            });
        }

        // =====================================================================
        // 📅 CALENDÁRIO MENSAL
        // =====================================================================
        let calState = { year: new Date().getFullYear(), month: new Date().getMonth() };

        function collectDeadlinesForMonth(year, month) {
            // retorna mapa dia -> [{title, overdue}]
            const map = {};
            Object.keys(database).forEach(catKey => {
                if (catKey.startsWith('//')) return;
                itemsOf(catKey).forEach(item => {
                    const titleBlock = item.blocks.find(b => b.type === 'titulo');
                    item.blocks.forEach(block => {
                        if (block.type === 'data' && block.value.includes('/')) {
                            const partes = block.value.split('/');
                            const dia = parseInt(partes[0]);
                            const mes = parseInt(partes[1]);
                            if (!isNaN(dia) && !isNaN(mes) && (mes - 1) === month) {
                                if (!map[dia]) map[dia] = [];
                                const diff = getDeadlineDiff(block.value);
                                map[dia].push({ title: titleBlock ? titleBlock.value : 'Sem título', overdue: diff !== null && diff < 0 });
                            }
                        }
                    });
                });
            });
            return map;
        }

        function renderCalendarHtml() {
            const { year, month } = calState;
            const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const deadlineMap = collectDeadlinesForMonth(year, month);
            const today = new Date();

            let cells = '';
            const dows = ['D','S','T','Q','Q','S','S'];
            dows.forEach(d => cells += `<div class="cal-dow">${d}</div>`);
            for (let i = 0; i < firstDay; i++) cells += `<div class="cal-day empty"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
                const hasDeadline = !!deadlineMap[d];
                const hasOverdue = hasDeadline && deadlineMap[d].some(x => x.overdue);
                cells += `<div class="cal-day ${isToday ? 'today' : ''} ${hasOverdue ? 'has-overdue' : ''}" onclick="showDayDeadlines(${d})">${d}${hasDeadline ? '<div class="dot"></div>' : ''}</div>`;
            }

            return `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button class="btn-control" style="background:var(--block-bg); padding:8px 12px;" onclick="changeCalMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                    <strong>${monthNames[month]} ${year}</strong>
                    <button class="btn-control" style="background:var(--block-bg); padding:8px 12px;" onclick="changeCalMonth(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="cal-grid">${cells}</div>
                <div id="cal-day-detail" style="margin-top:14px; text-align:left; font-size:0.85rem; min-height: 20px;"></div>
            `;
        }

        function changeCalMonth(dir) {
            calState.month += dir;
            if (calState.month > 11) { calState.month = 0; calState.year++; }
            if (calState.month < 0) { calState.month = 11; calState.year--; }
            playSound('click');
            document.getElementById('swal-cal-body').innerHTML = renderCalendarHtml();
        }

        function showDayDeadlines(day) {
            const map = collectDeadlinesForMonth(calState.year, calState.month);
            const detail = document.getElementById('cal-day-detail');
            const items = map[day] || [];
            if (items.length === 0) {
                detail.innerHTML = `<p style="color:var(--text-muted);">Nenhum prazo neste dia.</p>`;
            } else {
                detail.innerHTML = `<strong>Dia ${day}:</strong><br>` + items.map(it =>
                    `<span style="color:${it.overdue ? 'var(--error-color)' : 'var(--secondary-color)'};">• ${it.title}</span>`
                ).join('<br>');
            }
            playSound('click');
        }

        function openCalendar() {
            playSound('click');
            calState = { year: new Date().getFullYear(), month: new Date().getMonth() };
            Swal.fire({
                title: '<i class="fa-regular fa-calendar-days"></i> Calendário de Prazos',
                html: `<div id="swal-cal-body">${renderCalendarHtml()}</div>`,
                width: 420,
                confirmButtonText: 'Fechar',
                confirmButtonColor: 'var(--primary-color)'
            });
        }

        // =====================================================================
        // 🔍 FILTROS
        // =====================================================================
        function renderFilters() {
            const filters = [
                { id: 'all', label: 'Todos', icon: 'fa-list' },
                { id: 'overdue', label: 'Vencidos', icon: 'fa-triangle-exclamation' },
                { id: 'today', label: 'Hoje', icon: 'fa-calendar-day' },
                { id: 'week', label: 'Esta semana', icon: 'fa-calendar-week' },
                { id: 'favorites', label: 'Favoritos', icon: 'fa-star' }
            ];
            const menu = document.getElementById('filters-menu');
            menu.innerHTML = '';
            filters.forEach(f => {
                const chip = document.createElement('button');
                chip.className = `filter-chip ${filterMode === f.id ? 'active' : ''}`;
                chip.innerHTML = `<i class="fas ${f.icon}"></i> ${f.label}`;
                chip.onclick = () => {
                    playSound('click');
                    filterMode = f.id;
                    renderFilters();
                    renderItems();
                };
                menu.appendChild(chip);
            });
        }

        function itemPassesFilter(item) {
            if (filterMode === 'all') return true;
            if (filterMode === 'favorites') return !!item.favorite;
            const dataBlocks = item.blocks.filter(b => b.type === 'data' && b.value.includes('/'));
            if (dataBlocks.length === 0) return false;
            return dataBlocks.some(b => {
                const diff = getDeadlineDiff(b.value);
                if (diff === null) return false;
                if (filterMode === 'overdue') return diff < 0;
                if (filterMode === 'today') return diff === 0;
                if (filterMode === 'week') return diff >= 0 && diff <= 7;
                return false;
            });
        }

        // =====================================================================
        // RENDERIZADORES
        // =====================================================================
        function renderCategories() {
            const menu = document.getElementById('categories-menu');
            menu.innerHTML = '';

            // ⭐ Favoritos automático, sempre primeiro
            const favBtn = document.createElement('button');
            favBtn.className = `category-btn ${currentCategory === FAV_KEY ? 'active' : ''}`;
            favBtn.style.setProperty('--cat-color', '#ffd54f');
            favBtn.innerHTML = `⭐ Favoritos`;
            favBtn.onclick = () => {
                playSound('click');
                currentCategory = FAV_KEY;
                document.getElementById('delete-cat-btn').style.display = 'none';
                document.getElementById('add-item-btn').style.display = 'none';
                render();
            };
            menu.appendChild(favBtn);

            Object.keys(database).forEach(cat => {
                if (cat.trim() === '//' || cat.trim().startsWith('//_')) {
                    const separator = document.createElement('div');
                    separator.style.cssText = 'width: 2px; height: 22px; background-color: var(--text-muted); opacity: 0.3; margin: 0 6px; align-self: center; flex-shrink: 0; transition: 0.2s;';

                    if (isEditMode) {
                        separator.style.cursor = 'pointer';
                        separator.style.backgroundColor = 'var(--error-color)';
                        separator.style.width = '8px';
                        separator.style.borderRadius = '4px';
                        separator.style.opacity = '1';
                        separator.title = 'Excluir Separador';
                        separator.onclick = () => {
                            pushUndo();
                            delete database[cat];
                            saveData();
                            render();
                            playSound('delete');
                        }
                    }

                    menu.appendChild(separator);
                    return;
                }
                const catObj = database[cat];
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat === currentCategory ? 'active' : ''}`;
                if (catObj.color) btn.style.setProperty('--cat-color', catObj.color);
                btn.innerHTML = `${catObj.icon ? catObj.icon + ' ' : ''}${cat}`;
                btn.onclick = () => {
                    playSound('click');
                    currentCategory = cat;
                    document.getElementById('delete-cat-btn').style.display = isEditMode ? 'inline-block' : 'none';
                    document.getElementById('add-item-btn').style.display = isEditMode ? 'flex' : 'none';
                    render();
                };
                menu.appendChild(btn);
            });
        }

        function renderBlocksViewMode(block, itemIndex, blockIndex, groupTitle, catKey) {
            if (block.type === 'checklist') {
                const list = parseChecklist(block.value);
                if (list.length === 0) return '';
                const doneCount = list.filter(t => t.done).length;
                const lis = list.map((t, i) => `
                    <li class="checklist-item ${t.done ? 'done' : ''}" onclick="toggleChecklistItem(${itemIndex}, ${blockIndex}, ${i}, '${catKey}')">
                        <input type="checkbox" ${t.done ? 'checked' : ''} onclick="event.stopPropagation(); toggleChecklistItem(${itemIndex}, ${blockIndex}, ${i}, '${catKey}')">
                        <span>${t.text}</span>
                    </li>
                `).join('');
                return `<div class="checklist-progress">${doneCount}/${list.length} concluídos</div><ul class="checklist-list">${lis}</ul>`;
            }

            if (!block.value.trim()) return '';
            switch (block.type) {
                case 'titulo': return `<div class="view-titulo">${block.value}</div>`;
                case 'data':
                    const diff = getDeadlineDiff(block.value);
                    const overdueClass = (diff !== null && diff < 0) ? 'overdue' : '';
                    return `
                        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px;">
                            <div class="view-data ${overdueClass}"><i class="fa-regular fa-calendar"></i> Prazo: ${block.value}</div>
                            <button class="btn-control" style="background: var(--block-bg); color: var(--secondary-color); border: 1px solid rgba(3, 218, 198, 0.2); padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s;" onclick="downloadIcs('${block.value}', '${groupTitle.replace(/'/g, "\\'")}')">
                                <i class="fa-solid fa-calendar-plus"></i> Agendar
                            </button>
                        </div>
                    `;
                case 'sobre': return `<div class="view-sobre">${block.value}</div>`;
                case 'topicos':
                    const lis = block.value.split('\n')
                        .filter(t => t.trim() !== '' && t.trim() !== '-')
                        .map(t => `<li>${t.replace(/^- /, '')}</li>`).join('');
                    return `<ul class="view-topicos">${lis}</ul>`;
                case 'imagem':
                    return block.value.split('\n')
                        .filter(i => i.trim() !== '')
                        .map((i, imgIndex) => `<img src="${i}" class="view-imagem" alt="Anexo" style="cursor:pointer;" onclick="openImageModal(${itemIndex}, ${blockIndex}, ${imgIndex}, '${catKey}')">`).join('');
                case 'arquivo':
                    const files = block.value.split('\n').filter(f => f.trim() !== '');
                    let filesHtml = '<div class="file-list-view">';
                    files.forEach((f, fileIndex) => {
                        const parts = f.split('|||');
                        if (parts.length === 2) {
                            filesHtml += `
                                <button onclick="openFileViewer(${itemIndex}, ${blockIndex}, ${fileIndex}, '${catKey}')" class="file-link">
                                    <i class="fa-regular fa-file-lines" style="color:var(--secondary-color)"></i> ${parts[0]}
                                </button>
                            `;
                        }
                    });
                    filesHtml += '</div>';
                    return filesHtml;
                default: return '';
            }
        }

        function renderBlocksEditMode(block, itemIndex, blockIndex, catKey) {
            let inputHtml = '';
            if (block.type === 'data') {
                inputHtml = `<input type="text" placeholder="DD/MM" value="${block.value}" oninput="handleDateInput(this, ${itemIndex}, ${blockIndex}, '${catKey}')" maxlength="5">`;
            } else if (block.type === 'topicos') {
                inputHtml = `<textarea placeholder="Escreva e aperte Enter para gerar marcadores automaticamente..." onkeydown="handleListTextarea(event, this, ${itemIndex}, ${blockIndex}, '${catKey}')" oninput="updateBlockValue(${itemIndex}, ${blockIndex}, this.value, '${catKey}')">${block.value}</textarea>`;
            } else if (block.type === 'checklist') {
                const rawText = parseChecklist(block.value).map(t => t.text).join('\n');
                inputHtml = `<textarea placeholder="Um item por linha, ex:&#10;Comprar material&#10;Estudar capítulo 2" oninput="updateChecklistText(${itemIndex}, ${blockIndex}, this.value, '${catKey}')">${rawText}</textarea>`;
            } else if (block.type === 'sobre') {
                inputHtml = `<textarea placeholder="Detalhes textuais..." oninput="updateBlockValue(${itemIndex}, ${blockIndex}, this.value, '${catKey}')">${block.value}</textarea>`;
            } else if (block.type === 'imagem') {
                const previewImgs = block.value.split('\n').filter(i => i.trim() !== '').map((i, imgIndex) => `<img src="${i}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; cursor:pointer;" onclick="openImageModal(${itemIndex}, ${blockIndex}, ${imgIndex}, '${catKey}')" title="Clique para editar">`).join('');
                inputHtml = `
                    <div style="display: flex; flex-direction:column; gap: 8px;">
                        <input type="file" accept="image/*" multiple onchange="handleImageUpload(this, ${itemIndex}, ${blockIndex}, '${catKey}')" style="font-size:0.8rem; color: var(--text-muted)">
                        ${previewImgs ? `<div style="display: flex; gap: 6px; flex-wrap: wrap;">${previewImgs}</div>` : ''}
                    </div>
                `;
            } else if (block.type === 'arquivo') {
                const uploadedFiles = block.value.split('\n').filter(f => f.trim() !== '');
                let filesPreviewHtml = uploadedFiles.map(f => `<span style="font-size:0.75rem; background:rgba(255,255,255,0.05); padding:2px 6px; border-radius:4px;">📎 ${f.split('|||')[0]}</span>`).join(' ');
                inputHtml = `
                    <div style="display: flex; flex-direction:column; gap: 8px;">
                        <input type="file" multiple onchange="handleFileUpload(this, ${itemIndex}, ${blockIndex}, '${catKey}')" style="font-size:0.8rem; color: var(--text-muted)">
                        ${filesPreviewHtml ? `<div style="display: flex; gap: 4px; flex-wrap: wrap;">${filesPreviewHtml}</div>` : ''}
                    </div>
                `;
            } else {
                inputHtml = `<input type="text" placeholder="Digite o conteúdo..." value="${block.value}" oninput="updateBlockValue(${itemIndex}, ${blockIndex}, this.value, '${catKey}')">`;
            }

            const typeNames = { 'titulo': 'Título', 'data': 'Prazo Limite', 'sobre': 'Descrição Textual', 'topicos': 'Lista de Tópicos', 'checklist': 'Checklist', 'imagem': 'Mídia / Imagem', 'arquivo': 'Documentos e Arquivos' };

            return `
                <div class="block-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="block-type-badge">${typeNames[block.type] || block.type}</span>
                        <div class="block-controls">
                            <button class="btn-control" onclick="moveBlock(${itemIndex}, ${blockIndex}, -1, '${catKey}')"><i class="fas fa-angle-up"></i></button>
                            <button class="btn-control" onclick="moveBlock(${itemIndex}, ${blockIndex}, 1, '${catKey}')"><i class="fas fa-angle-down"></i></button>
                            <button class="btn-control danger" onclick="deleteBlock(${itemIndex}, ${blockIndex}, '${catKey}')"><i class="fas fa-trash-can"></i></button>
                        </div>
                    </div>
                    ${inputHtml}
                </div>
            `;
        }

        function buildGroupToolbar(item, itemIndex, catKey, showOrigin) {
            return `
                <div class="group-toolbar">
                    ${showOrigin ? `<span class="origin-tag">${database[catKey] && database[catKey].icon ? database[catKey].icon + ' ' : ''}${catKey}</span>` : ''}
                    <button class="icon-toggle" title="Editar tags" onclick="editTags(${itemIndex}, '${catKey}')"><i class="fas fa-tag"></i></button>
                    <button class="icon-toggle ${item.pinned ? 'on-pin' : ''}" title="Fixar grupo" onclick="togglePin(${itemIndex}, '${catKey}')"><i class="fas fa-thumbtack"></i></button>
                    <button class="icon-toggle ${item.favorite ? 'on-fav' : ''}" title="Favoritar" onclick="toggleFavorite(${itemIndex}, '${catKey}')"><i class="${item.favorite ? 'fas' : 'fa-regular'} fa-star"></i></button>
                </div>
            `;
        }

        function renderGroupDiv(item, itemIndex, catKey, showOrigin) {
            const groupDiv = document.createElement('div');
            groupDiv.className = `item-group ${item.pinned ? 'is-pinned' : ''}`;

            let innerHTML = buildGroupToolbar(item, itemIndex, catKey, showOrigin);

            if (item.tags && item.tags.length > 0) {
                innerHTML += `<div class="tags-row">${item.tags.map(t => `<span class="tag-chip">#${t}</span>`).join('')}</div>`;
            }

            const titleBlock = item.blocks.find(b => b.type === 'titulo');
            const groupTitle = titleBlock ? titleBlock.value : "Prazo do Painel Modular";

            if (isEditMode && catKey === currentCategory) {
                item.blocks.forEach((block, blockIndex) => {
                    innerHTML += renderBlocksEditMode(block, itemIndex, blockIndex, catKey);
                });
                innerHTML += `
                    <div class="add-blocks-menu">
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'titulo', '${catKey}')">+ Título</button>
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'data', '${catKey}')">+ Data</button>
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'sobre', '${catKey}')">+ Descrição</button>
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'topicos', '${catKey}')">+ Tópicos</button>
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'checklist', '${catKey}')">+ Checklist</button>
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'imagem', '${catKey}')">+ Imagem</button>
                        <button class="btn-add-block" onclick="addBlock(${itemIndex}, 'arquivo', '${catKey}')">+ Arquivo</button>
                        <button class="btn-add-block" style="border-color:var(--error-color); color:var(--error-color); margin-left: auto;" onclick="deleteItem(${itemIndex}, '${catKey}')"><i class="fas fa-trash-can"></i> Grupo</button>
                    </div>
                `;
            } else {
                if (item.blocks.length === 0) innerHTML += `<p style="color: var(--text-muted); font-style: italic; font-size:0.9rem;">Grupo sem blocos.</p>`;
                item.blocks.forEach((block, blockIndex) => {
                    innerHTML += renderBlocksViewMode(block, itemIndex, blockIndex, groupTitle, catKey);
                });
            }

            groupDiv.innerHTML = innerHTML;
            return groupDiv;
        }

        function sortedIndices(items) {
            return items.map((it, idx) => idx).sort((a, b) => {
                const pa = items[a].pinned ? 1 : 0;
                const pb = items[b].pinned ? 1 : 0;
                return pb - pa;
            });
        }

        function renderItems() {
            const list = document.getElementById('items-list');
            list.innerHTML = '';

            const catHeaderElement = document.getElementById('current-category');
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            function matchesSearchAndFilter(item) {
                if (!itemPassesFilter(item)) return false;
                if (!searchQuery) return true;
                const tagMatch = item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery));
                if (tagMatch) return true;
                return item.blocks.some(block => {
                    if (block.type === 'arquivo') return block.value.split('\n').some(f => f.split('|||')[0].toLowerCase().includes(searchQuery));
                    if (block.type === 'checklist') return parseChecklist(block.value).some(t => t.text.toLowerCase().includes(searchQuery));
                    return block.value.toLowerCase().includes(searchQuery);
                });
            }

            if (currentCategory === FAV_KEY) {
                catHeaderElement.textContent = '⭐ Favoritos';
                let any = false;
                Object.keys(database).forEach(catKey => {
                    if (catKey.startsWith('//')) return;
                    itemsOf(catKey).forEach((item, itemIndex) => {
                        if (!item.favorite) return;
                        if (!matchesSearchAndFilter(item)) return;
                        any = true;
                        list.appendChild(renderGroupDiv(item, itemIndex, catKey, true));
                    });
                });
                if (!any) list.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 20px 0;">Nenhum favorito encontrado.</p>`;
                return;
            }

            if (isEditMode && currentCategory && !currentCategory.startsWith('//')) {
                const catObj = database[currentCategory];
                catHeaderElement.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                        <span>${catObj && catObj.icon ? catObj.icon + ' ' : ''}${currentCategory}</span>
                        <div style="display: flex; gap: 6px;">
                            <button class="btn-control" onclick="moveCategory(-1)" title="Mover Categoria para Esquerda" style="padding: 6px 10px; background: var(--block-bg);"><i class="fas fa-arrow-left"></i></button>
                            <button class="btn-control" onclick="moveCategory(1)" title="Mover Categoria para Direita" style="padding: 6px 10px; background: var(--block-bg);"><i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>
                `;
            } else {
                const catObj = database[currentCategory];
                catHeaderElement.textContent = currentCategory ? `${catObj && catObj.icon ? catObj.icon + ' ' : ''}${currentCategory}` : "Crie ou selecione uma categoria";
            }

            if (!currentCategory || !database[currentCategory] || currentCategory.startsWith('//')) return;

            const items = itemsOf(currentCategory);
            const order = sortedIndices(items);

            let any = false;
            order.forEach(itemIndex => {
                const item = items[itemIndex];
                if (!matchesSearchAndFilter(item)) return;
                any = true;
                list.appendChild(renderGroupDiv(item, itemIndex, currentCategory, false));
            });
            if (!any && items.length > 0) list.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 20px 0;">Nenhum resultado com estes filtros.</p>`;
        }

        function render() {
            renderCategories();
            renderFilters();
            renderItems();
            updateUndoButtons();
        }

        // =====================================================================
        // BOOT
        // =====================================================================
        function boot() {
            render();
            checkNotifications();
        }

        if (!checkLockState()) {
            boot();
        }
    </script>
</body>
</html>
