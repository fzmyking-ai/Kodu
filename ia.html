<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistente IA | Painel Escolar</title>
    <style>
        :root {
            --primary-color: #3b82f6; --primary-hover: #2563eb; --ia-color: #8b5cf6;
            --bg-color: #f3f4f6; --card-bg: #ffffff; --block-bg: #f9fafb;
            --text-main: #1f2937; --text-muted: #6b7280; --border-color: #e5e7eb;
            --border-radius: 12px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --primary-color: #60a5fa; --ia-color: #a78bfa; --bg-color: #0f172a;
            --card-bg: #1e293b; --block-bg: #334155; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border-color: #334155; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; transition: background-color 0.3s; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 12px 20px;
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); box-shadow: var(--shadow); gap: 10px; flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; text-decoration: none; }
        .icon-btn:hover { color: var(--ia-color); background: rgba(139, 92, 246, 0.1); }
        .header-titles h1 { color: var(--ia-color); font-size: 1.2rem; letter-spacing: -0.5px; white-space: nowrap; }
        .header-titles p { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .btn:hover { border-color: var(--primary-color); color: var(--primary-color); background: rgba(59, 130, 246, 0.05); }
        .btn-new { border-color: var(--ia-color); color: var(--ia-color); }
        .btn-new:hover { background: rgba(139, 92, 246, 0.1); border-color: var(--ia-color); color: var(--ia-color); }
        .btn-danger { border-color: #ef4444; color: #ef4444; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

        .app-container { display: flex; flex-grow: 1; gap: 20px; overflow: hidden; position: relative; min-height: 0; }

        .sidebar { width: 310px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow); z-index: 90; flex-shrink: 0; }
        .sidebar.hidden { display: none; }
        .sidebar-header { padding: 18px 15px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-actions { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .chat-list { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .chat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-main); font-size: 0.9rem; background: var(--bg-color); border: 1px solid transparent; transition: 0.2s; gap: 8px; }
        .chat-item-text { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item:hover { border-color: var(--ia-color); }
        .chat-item.active { background: rgba(139, 92, 246, 0.1); border-color: var(--ia-color); color: var(--ia-color); font-weight: 600; }
        .chat-item.pinned { border-left: 3px solid #eab308; }
        
        .chat-item-tools { display: flex; gap: 4px; }
        .chat-tool-btn { opacity: 0.4; transition: 0.2s; cursor: pointer; padding: 4px; font-size: 0.85rem; border-radius: 4px; background: none; border: none; }
        .chat-tool-btn:hover { opacity: 1; background: rgba(0,0,0,0.1); }
        [data-theme="dark"] .chat-tool-btn:hover { background: rgba(255,255,255,0.1); }
        .chat-tool-btn.pin-active { opacity: 1; color: #eab308; }
        .chat-tool-btn.del-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(2px); }
        .modal { background: var(--card-bg); padding: 24px; border-radius: var(--border-radius); width: 90%; max-width: 450px; border: 1px solid var(--border-color); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; animation: scaleUp 0.2s ease-out; }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { color: var(--ia-color); font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
        .modal p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: bold; }
        .input-group input, .input-group textarea { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 11px; border-radius: 8px; outline: none; font-family: inherit; font-size: 0.9rem; transition: 0.2s; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--ia-color); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        .chat-wrapper { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--card-bg); border-radius: var(--border-radius); border: 1px solid var(--border-color); box-shadow: var(--shadow); overflow: hidden; position: relative; min-width: 0; }
        .chat-history { flex-grow: 1; padding: 20px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }

        .msg-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; transition: transform 0.2s ease-out; }
        .msg-header { font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
        .message { max-width: 90%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; position: relative; word-wrap: break-word; user-select: text; }
        
        .user-wrapper { align-items: flex-end; }
        .user-wrapper .msg-header { color: var(--primary-color); }
        .user-message { background-color: var(--primary-color); color: white; border-top-right-radius: 2px; }
        
        .ia-wrapper { align-items: flex-start; }
        .ia-wrapper .msg-header { color: var(--ia-color); }
        .ia-message { background-color: var(--block-bg); color: var(--text-main); border: 1px solid var(--border-color); border-top-left-radius: 2px; }
        
        .typing-cursor::after { content: '▋'; animation: blink 1s step-start infinite; color: var(--ia-color); margin-left: 4px; }
        @keyframes blink { 50% { opacity: 0; } }

        .msg-actions { display: flex; gap: 14px; font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; margin-top: 5px; padding: 0 4px; }
        .msg-wrapper:hover .msg-actions { opacity: 1; }
        .action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; transition: color 0.2s; }
        .action-btn:hover { color: var(--ia-color); }

        .message strong { font-weight: 700; } .message em { font-style: italic; } .message del { text-decoration: line-through; opacity: 0.8; }
        .message blockquote { border-left: 4px solid var(--ia-color); padding-left: 10px; margin: 10px 0; background: rgba(139, 92, 246, 0.05); border-radius: 4px; }
        .message pre { background: var(--bg-color); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-family: monospace; border: 1px solid var(--border-color); }
        .message code { font-family: monospace; background: rgba(0,0,0,0.06); padding: 2px 5px; border-radius: 4px; }
        [data-theme="dark"] .message code { background: rgba(255,255,255,0.1); }
        .copy-block { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-color); border: 1px solid var(--ia-color); padding: 4px 10px; border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 0.85rem; color: var(--ia-color); transition: 0.2s; margin: 2px 0; }
        .copy-block:hover { background: var(--ia-color); color: white; }

        .btn-homework { display: inline-flex; align-items: center; gap: 8px; background: var(--ia-color); color: white !important; font-weight: bold; text-decoration: none; padding: 10px 20px; border-radius: 8px; margin-top: 10px; transition: 0.2s; border: none; cursor: pointer; }
        .btn-homework:hover { background: #7c3aed; transform: translateY(-2px); }

        .pinned-area { display: none; background: var(--block-bg); border-top: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.85rem; border-left: 4px solid var(--ia-color); position: relative; flex-shrink: 0; }
        .pinned-area span { display: block; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
        .pinned-text-content { color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 20px; }
        .close-pin { position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--text-muted); background: none; border: none; font-size: 1rem; }

        .chat-input-area { padding: 15px 20px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .input-row { display: flex; gap: 12px; align-items: flex-end; width: 100%; }
        textarea { flex-grow: 1; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; font-size: 0.95rem; outline: none; resize: none; min-height: 50px; max-height: 120px; transition: border-color 0.2s; line-height: 1.5; }
        textarea:focus { border-color: var(--ia-color); }
        .btn-send { background: var(--ia-color); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-send:hover:not(:disabled) { background: #7c3aed; }
        .btn-send:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.5; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; height: 100%; transform: translateX(-110%); z-index: 100; }
            .sidebar.active { transform: translateX(0); display: flex; }
            .message { max-width: 95%; }
            .header-actions .btn:first-child { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
<a href="tutorial.html" target="_self" class="btn btn-icon" title="Abrir Tutorial">❓</a>
            <a href="index.html" class="icon-btn" title="Voltar ao Painel">🏠</a>
            <button class="icon-btn" id="menu-toggle" title="Menu de Chats">☰</button>
            <div class="header-titles">
                <h1 id="header-ia-name">✨ Tutora IA</h1>
                <p>Ensino guiado passo a passo</p>
            </div>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" class="btn icon-btn" title="Mudar Tema">☀️</button>
            <button id="settings-btn" class="icon-btn" title="Configurações">⚙️</button>
        </div>
    </header>

    <div class="app-container">
        <div class="sidebar hidden" id="sidebar">
            <div class="sidebar-header">
                Histórico
                <button class="icon-btn" style="font-size: 1rem; width:30px; height:30px;" id="close-sidebar">✖</button>
            </div>
            <div class="sidebar-actions">
                <button id="new-chat-btn" class="btn btn-new" style="width: 100%; justify-content: center;">+ Novo Chat</button>
            </div>
            <div class="chat-list" id="chat-list"></div>
        </div>

        <div class="chat-wrapper">
            <div class="chat-history" id="chat-history"></div>
            
            <div class="pinned-area" id="pinned-area">
                <span>📌 Respondendo a:</span>
                <div class="pinned-text-content" id="pinned-text"></div>
                <button class="close-pin" onclick="clearPin()">✖</button>
            </div>

            <div class="chat-input-area">
                <div class="input-row">
                    <textarea id="user-input" placeholder="Pergunte algo escolar..." rows="1"></textarea>
                    <button class="btn-send" id="send-btn">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>⚙️ Configurações</h2>
            <div class="input-group">
                <label>Nome da IA:</label>
                <input type="text" id="cfg-ia-name" value="Professora IA">
            </div>
            <div class="input-group">
                <label>Seu Nome/Apelido:</label>
                <input type="text" id="cfg-user-name" value="Aluno">
            </div>
            <div class="input-group">
                <label>Personalidade da IA:</label>
                <textarea id="cfg-prompt" rows="3">Seja fofa e acolhedora. Use um leve sotaque gaúcho (tchê, tri legal, bah). Use emojis de forma equilibrada.</textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" id="close-modal-btn">Cancelar</button>
                <button class="btn btn-new" id="save-settings-btn">Salvar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="custom-prompt-modal">
        <div class="modal">
            <h2 id="custom-prompt-title">✏️ Editar</h2>
            <div class="input-group">
                <input type="text" id="custom-prompt-input">
            </div>
            <div class="modal-actions">
                <button class="btn" id="custom-prompt-cancel">Cancelar</button>
                <button class="btn btn-new" id="custom-prompt-confirm">Salvar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="custom-confirm-modal">
        <div class="modal">
            <h2 id="custom-confirm-title">⚠️ Atenção</h2>
            <p id="custom-confirm-message">Deseja continuar?</p>
            <div class="modal-actions">
                <button class="btn" id="custom-confirm-cancel">Cancelar</button>
                <button class="btn btn-danger" id="custom-confirm-ok">Sim, continuar</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES GERAIS E API ---
        const API_KEY = "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"; 
        let IS_GENERATING = false;

        const chatHistoryDOM = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const pinnedArea = document.getElementById('pinned-area');
        const pinnedTextDiv = document.getElementById('pinned-text');
        const sidebar = document.getElementById('sidebar');
        const modal = document.getElementById('settings-modal');
        
        const settings = JSON.parse(localStorage.getItem('ia_settings')) || {
            iaName: "Professora IA", userName: "Aluno",
            customPrompt: "Seja fofa e acolhedora. Use um leve sotaque gaúcho (tchê, tri legal, bah). Use emojis de forma equilibrada."
        };

        let allChats = JSON.parse(localStorage.getItem('ia_chats_db_v4')) || {};
        let currentChatId = localStorage.getItem('ia_current_chat_v4') || null;
        let messagesContext = [];
        let pinnedMessageContext = ""; 

        // --- SISTEMA DE MODAIS CUSTOMIZADOS ---
        function customPrompt(title, defaultValue) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-prompt-modal');
                const titleEl = document.getElementById('custom-prompt-title');
                const inputEl = document.getElementById('custom-prompt-input');
                const btnCancel = document.getElementById('custom-prompt-cancel');
                const btnConfirm = document.getElementById('custom-prompt-confirm');

                titleEl.textContent = title;
                inputEl.value = defaultValue || '';
                modal.style.display = 'flex';
                inputEl.focus();

                const cleanup = () => {
                    modal.style.display = 'none';
                    btnCancel.onclick = null;
                    btnConfirm.onclick = null;
                    inputEl.onkeydown = null;
                };

                btnCancel.onclick = () => { cleanup(); resolve(null); };
                btnConfirm.onclick = () => { cleanup(); resolve(inputEl.value); };
                inputEl.onkeydown = (e) => { 
                    if(e.key === 'Enter') btnConfirm.click(); 
                    if(e.key === 'Escape') btnCancel.click(); 
                };
            });
        }

        function customConfirm(title, message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-confirm-modal');
                const titleEl = document.getElementById('custom-confirm-title');
                const msgEl = document.getElementById('custom-confirm-message');
                const btnCancel = document.getElementById('custom-confirm-cancel');
                const btnOk = document.getElementById('custom-confirm-ok');

                titleEl.innerHTML = title;
                msgEl.textContent = message;
                modal.style.display = 'flex';

                const cleanup = () => {
                    modal.style.display = 'none';
                    btnCancel.onclick = null;
                    btnOk.onclick = null;
                };

                btnCancel.onclick = () => { cleanup(); resolve(false); };
                btnOk.onclick = () => { cleanup(); resolve(true); };
            });
        }

        // --- 2. INTEGRAÇÃO E MEMÓRIA DE OUTROS CHATS ---
        function getTrabalhosPendentes() {
            try {
                const db = JSON.parse(localStorage.getItem('painel_modular_v2'));
                if (!db) return "Nenhum trabalho cadastrado.";
                let listagem = "";
                let encontrouAlgo = false;
                for (const [categoria, grupos] of Object.entries(db)) {
                    grupos.forEach(grupo => {
                        let titulo = "Tarefa sem título", data = "Sem data", sobre = "";
                        grupo.forEach(bloco => {
                            if (bloco.type === 'titulo') titulo = bloco.value;
                            if (bloco.type === 'data') data = bloco.value;
                            if (bloco.type === 'sobre') sobre = bloco.value;
                        });
                        if (titulo !== "Tarefa sem título" || data !== "Sem data") {
                            listagem += `- [${categoria}] ${titulo} | Prazo: ${data} | Detalhes: ${sobre}\n`;
                            encontrouAlgo = true;
                        }
                    });
                }
                return encontrouAlgo ? listagem : "O aluno não possui trabalhos pendentes anotados no momento.";
            } catch (e) { return "Erro ao acessar trabalhos."; }
        }

        function getCrossChatMemory() {
            let memoryText = "";
            const otherChatIds = Object.keys(allChats).filter(id => id !== currentChatId);
            const recentChats = otherChatIds.slice(-2);
            
            recentChats.forEach(id => {
                const chat = allChats[id];
                const validMsgs = (chat.messages || []).filter(m => m.role !== 'system');
                if(validMsgs.length > 0) {
                    memoryText += `\n[Tópico em outro chat: ${chat.title}]\n`;
                    validMsgs.slice(-2).forEach(m => {
                        const speaker = m.role === 'user' ? settings.userName : settings.iaName;
                        memoryText += `${speaker}: ${m.content.substring(0, 150)}...\n`;
                    });
                }
            });
            return memoryText ? `\n\n=== MEMÓRIA DE OUTROS CHATS (Use como contexto se o aluno referenciar assuntos passados) ===${memoryText}` : "";
        }

        // --- 3. CONFIGURAÇÕES VISUAIS & UTILS ---
        const htmlElement = document.documentElement;
        document.getElementById('theme-toggle').addEventListener('click', (e) => {
            const target = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', target);
            e.target.textContent = target === 'dark' ? '☀️' : '🌙';
        });

        document.getElementById('menu-toggle').addEventListener('click', () => { sidebar.classList.toggle('hidden'); sidebar.classList.toggle('active'); });
        document.getElementById('close-sidebar').addEventListener('click', () => { sidebar.classList.add('hidden'); sidebar.classList.remove('active'); });

        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('cfg-ia-name').value = settings.iaName;
            document.getElementById('cfg-user-name').value = settings.userName;
            document.getElementById('cfg-prompt').value = settings.customPrompt;
            modal.style.display = 'flex';
        });
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.style.display = 'none');
        document.getElementById('save-settings-btn').addEventListener('click', () => {
            settings.iaName = document.getElementById('cfg-ia-name').value || "Professora IA";
            settings.userName = document.getElementById('cfg-user-name').value || "Aluno";
            settings.customPrompt = document.getElementById('cfg-prompt').value;
            localStorage.setItem('ia_settings', JSON.stringify(settings));
            document.getElementById('header-ia-name').textContent = `✨ ${settings.iaName}`;
            modal.style.display = 'none';
            buildSystemPrompt();
            loadChat(currentChatId);
        });
        document.getElementById('header-ia-name').textContent = `✨ ${settings.iaName}`;

        // --- 4. PROMPT DO SISTEMA ATUALIZADO ---
        let systemPrompt = {};
        function buildSystemPrompt() {
            const dadosDoPainel = getTrabalhosPendentes();
            const crossContext = getCrossChatMemory();

            systemPrompt = {
                role: "system",
                content: `Você é uma Assistente Escolar e Tutora Pedagógica de Inteligência Artificial. Seu nome é ${settings.iaName} e você conversa com o(a) aluno(a) chamado(a) ${settings.userName}. 
                PERSONALIDADE BASE: ${settings.customPrompt}
                
                ⚠️ DIRETRIZES PEDAGÓGICAS CRÍTICAS E INQUEBRÁVEIS:
                1. PROIBIÇÃO ABSOLUTA DE RESPOSTAS DIRETAS: JAMAIS forneça respostas prontas, gabaritos ou resultados finais. Faça o aluno PENSAR.
                2. METODOLOGIA PARA EXATAS: Crie exemplos com números mais fáceis e explique só o PRIMEIRO passo.
                3. METODOLOGIA PARA HUMANAS: Forneça pistas e textos didáticos para o aluno interpretar.
                4. COMANDO "ENSINAR": Se o aluno implorar, peça para digitar "ENSINAR" e guie-o passo a passo.
                5. PAINEL DE TAREFAS: Se o aluno perguntar de trabalhos, liste o conteúdo abaixo e ponha OBRIGATORIAMENTE a tag {VER_TRABALHOS} no fim:
                [LISTA DE TRABALHOS DO PAINEL]\n${dadosDoPainel}\n[FIM DA LISTA]
                ${crossContext}
                `
            };
            if(messagesContext.length > 0) messagesContext[0] = systemPrompt;
        }

        // --- 5. FLUXO DE COMPORTAMENTO DOS MÚLTIPLOS CHATS ---
        function generateId() { return 'chat_' + Math.random().toString(36).substr(2, 9); }
        
        function createNewChat() {
            if(IS_GENERATING) return;
            const newId = generateId();
            allChats[newId] = { title: "Novo Chat ✨", messages: [], isPinned: false };
            localStorage.setItem('ia_chats_db_v4', JSON.stringify(allChats));
            currentChatId = newId;
            localStorage.setItem('ia_current_chat_v4', currentChatId);
            loadChat(newId);
            renderChatList();
            if(window.innerWidth <= 768) sidebar.classList.remove('active');
        }

        function saveDB() {
            if(currentChatId && allChats[currentChatId]) {
                allChats[currentChatId].messages = messagesContext.filter(m => m.role !== 'system');
            }
            localStorage.setItem('ia_chats_db_v4', JSON.stringify(allChats));
            localStorage.setItem('ia_current_chat_v4', currentChatId);
            renderChatList();
        }

        function loadChat(chatId) {
            if(!chatId || !allChats[chatId]) return;
            currentChatId = chatId;
            localStorage.setItem('ia_current_chat_v4', currentChatId);
            chatHistoryDOM.innerHTML = '';
            buildSystemPrompt();
            messagesContext = [systemPrompt];
            
            const savedMsgs = allChats[chatId].messages || [];
            if (savedMsgs.length === 0) {
                const welcomeMsg = `Oi, ${settings.userName}! Sou a ${settings.iaName}. Que bom te ver por aqui! Quer ajuda com alguma matéria ou quer que eu cheque sua lista de trabalhos? Lembrando que eu não dou respostas prontas, eu te ensino passo a passo! 📚`;
                messagesContext.push({ role: "assistant", content: welcomeMsg });
                renderMessage(welcomeMsg, false, 1);
            } else {
                savedMsgs.forEach((msg, index) => {
                    messagesContext.push(msg);
                    renderMessage(msg.content, msg.role === 'user', index + 1);
                });
            }
            renderChatList();
            scrollToBottom();
            if(window.innerWidth <= 768) sidebar.classList.remove('active');
        }

        async function generateAutoTitle(chatId) {
            const chat = allChats[chatId];
            if (!chat) return;
            const msgs = chat.messages.filter(m => m.role === 'user');
            if(msgs.length === 0) return;
            
            const textRef = msgs[0].content.replace(/\(Referenciando:.*?\)\n\n/, "").substring(0, 150);
            const promptTitle = `Crie um título de no máximo 4 palavras resumindo este assunto escolar: "${textRef}". Retorne apenas o título, sem aspas, nem introduções.`;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: promptTitle }],
                        temperature: 0.3
                    })
                });
                const data = await res.json();
                const newTitle = data.choices[0].message.content.trim().replace(/["']/g, "");
                
                if(allChats[chatId] && allChats[chatId].title.startsWith("Novo Chat")) {
                    allChats[chatId].title = newTitle;
                    localStorage.setItem('ia_chats_db_v4', JSON.stringify(allChats));
                    renderChatList();
                }
            } catch (e) { console.log("Falha ao gerar título.", e); }
        }

        function togglePin(id, e) {
            e.stopPropagation();
            if(allChats[id]) {
                allChats[id].isPinned = !allChats[id].isPinned;
                localStorage.setItem('ia_chats_db_v4', JSON.stringify(allChats));
                renderChatList();
            }
        }

        async function editChatTitle(id, e) {
            e.stopPropagation();
            if(!allChats[id]) return;
            const newTitle = await customPrompt("✏️ Nome do chat:", allChats[id].title);
            if(newTitle !== null && newTitle.trim() !== "") {
                allChats[id].title = newTitle.trim();
                localStorage.setItem('ia_chats_db_v4', JSON.stringify(allChats));
                renderChatList();
            }
        }

        function renderChatList() {
            const listDOM = document.getElementById('chat-list');
            listDOM.innerHTML = '';
            const keys = Object.keys(allChats);
            
            if(keys.length === 0) {
                listDOM.innerHTML = '<div style="padding:10px; color:var(--text-muted); font-size:0.85rem; text-align:center;">Nenhum chat ativo</div>';
                return;
            }

            const pinnedKeys = keys.filter(id => allChats[id].isPinned).reverse();
            const unpinnedKeys = keys.filter(id => !allChats[id].isPinned).reverse();
            const sortedKeys = [...pinnedKeys, ...unpinnedKeys];

            sortedKeys.forEach(id => {
                const item = allChats[id];
                const div = document.createElement('div');
                div.className = `chat-item ${id === currentChatId ? 'active' : ''} ${item.isPinned ? 'pinned' : ''}`;
                div.onclick = () => { if(!IS_GENERATING) loadChat(id); };
                
                const txtSpan = document.createElement('span');
                txtSpan.className = 'chat-item-text';
                txtSpan.textContent = item.title || "Chat sem título";
                div.appendChild(txtSpan);
                
                const toolsDiv = document.createElement('div');
                toolsDiv.className = 'chat-item-tools';

                // Botão de Fixar
                const pinBtn = document.createElement('button');
                pinBtn.className = `chat-tool-btn ${item.isPinned ? 'pin-active' : ''}`;
                pinBtn.innerHTML = '📌';
                pinBtn.title = item.isPinned ? "Desafixar Chat" : "Fixar Chat";
                pinBtn.onclick = (e) => togglePin(id, e);
                toolsDiv.appendChild(pinBtn);

                // Botão de Editar
                const editBtn = document.createElement('button');
                editBtn.className = 'chat-tool-btn';
                editBtn.innerHTML = '✏️';
                editBtn.title = "Editar Nome";
                editBtn.onclick = (e) => editChatTitle(id, e);
                toolsDiv.appendChild(editBtn);

                // Botão de Deletar com Custom Confirm
                const delBtn = document.createElement('button');
                delBtn.className = 'chat-tool-btn del-btn';
                delBtn.innerHTML = '🗑️';
                delBtn.title = "Excluir Chat";
                delBtn.onclick = async (e) => {
                    e.stopPropagation();
                    if(IS_GENERATING) return;
                    
                    const isConfirmed = await customConfirm('🗑️ Excluir Chat', 'Você tem certeza que deseja excluir o histórico deste chat para sempre?');
                    
                    if(isConfirmed) {
                        delete allChats[id];
                        localStorage.setItem('ia_chats_db_v4', JSON.stringify(allChats));
                        const remainingKeys = Object.keys(allChats);
                        if(currentChatId === id) {
                            currentChatId = remainingKeys.length > 0 ? remainingKeys[remainingKeys.length - 1] : null;
                            localStorage.setItem('ia_current_chat_v4', currentChatId);
                        }
                        if(!currentChatId) { createNewChat(); } else { loadChat(currentChatId); }
                    }
                };
                toolsDiv.appendChild(delBtn);
                
                div.appendChild(toolsDiv);
                listDOM.appendChild(div);
            });
        }

        // --- 6. PARSER DE RENDERIZAÇÃO ---
        function parseMarkdown(text) {
            let cleanText = text.replace(/\(Referenciando:.*?\)\n\n/, ""); 
            let html = cleanText.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');
            html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
            html = html.replace(/^&gt; (.*?)$/gm, '<blockquote>$1</blockquote>');
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/\[(.*?)\]/g, `<span class="copy-block" onclick="copySpecificText('$1', this)">$1 📋</span>`);
            html = html.replace(/\{VER_TRABALHOS\}/g, `<br><button class="btn-homework" onclick="redirecionarTrabalhos()">📚 Ir para o Painel de Trabalhos</button>`);
            return html.replace(/\n/g, '<br>');
        }

        window.redirecionarTrabalhos = function() { window.location.href = "index.html"; }
        window.copySpecificText = function(text, element) {
            navigator.clipboard.writeText(text);
            const originalHtml = element.innerHTML;
            element.innerHTML = "Copiado! ✅";
            setTimeout(() => element.innerHTML = originalHtml, 2000);
        }

        function renderMessage(text, isUser, contextIndex, isStreaming = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isUser ? 'user-wrapper' : 'ia-wrapper'}`;
            wrapper.dataset.index = contextIndex;

            const headerDiv = document.createElement('div');
            headerDiv.className = 'msg-header';
            headerDiv.innerHTML = isUser ? `👤 Você` : `✨ ${settings.iaName}`;
            wrapper.appendChild(headerDiv);

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ia-message'}`;
            if(isStreaming) msgDiv.classList.add('typing-cursor');
            msgDiv.innerHTML = parseMarkdown(text);
            wrapper.appendChild(msgDiv);
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'msg-actions';

            if(!isStreaming) {
                const pinBtn = document.createElement('button');
                pinBtn.className = 'action-btn';
                pinBtn.innerHTML = '📌 Fixar Text';
                pinBtn.onclick = () => pinText(text);
                actionsDiv.appendChild(pinBtn);

                if (isUser) {
                    const editBtn = document.createElement('button');
                    editBtn.className = 'action-btn';
                    editBtn.innerHTML = '✏️ Editar';
                    editBtn.onclick = () => { if(!IS_GENERATING) editMessage(contextIndex, text); };
                    actionsDiv.appendChild(editBtn);
                } else {
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'action-btn';
                    copyBtn.innerHTML = '📋 Copiar';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(text.replace(/\(Referenciando:.*?\)\n\n/, ""));
                        copyBtn.innerHTML = '✅ Copiado'; setTimeout(() => copyBtn.innerHTML = '📋 Copiar', 2000);
                    };
                    actionsDiv.appendChild(copyBtn);

                    const regenBtn = document.createElement('button');
                    regenBtn.className = 'action-btn';
                    regenBtn.innerHTML = '🔄 Refazer';
                    regenBtn.onclick = () => { if(!IS_GENERATING) regenerateResponse(contextIndex); };
                    actionsDiv.appendChild(regenBtn);
                }
            }

            wrapper.appendChild(actionsDiv);
            chatHistoryDOM.appendChild(wrapper);
            return msgDiv;
        }

        function scrollToBottom() { chatHistoryDOM.scrollTop = chatHistoryDOM.scrollHeight; }

        function pinText(text) {
            let clean = text.replace(/\(Referenciando:.*?\)\n\n/, "");
            pinnedMessageContext = clean;
            pinnedTextDiv.textContent = clean;
            pinnedArea.style.display = 'block';
            userInput.focus();
        }
        function clearPin() { pinnedMessageContext = ""; pinnedArea.style.display = 'none'; }

        function editMessage(index, text) {
            userInput.value = text.replace(/\(Referenciando:.*?\)\n\n/, "");
            messagesContext = messagesContext.slice(0, index);
            saveDB(); loadChat(currentChatId); userInput.focus();
        }

        // --- 7. COMUNICAÇÃO COM A API ---
        async function sendMessage() {
            if(IS_GENERATING) return;
            let text = userInput.value.trim();
            if (!text) return;

            buildSystemPrompt();
            let promptToSend = text;
            if (pinnedMessageContext) { promptToSend = `(Referenciando: "${pinnedMessageContext}")\n\n${text}`; clearPin(); }

            const contextIndex = messagesContext.length;
            messagesContext.push({ role: "user", content: promptToSend });
            renderMessage(text, true, contextIndex);
            
            userInput.value = ''; userInput.style.height = 'auto';
            sendBtn.disabled = true; sendBtn.textContent = '⏳';
            IS_GENERATING = true;
            scrollToBottom();

            await executeAiCall();
        }

        async function regenerateResponse(index) {
            if(IS_GENERATING) return;
            messagesContext = messagesContext.slice(0, index);
            while(chatHistoryDOM.children.length > index - 1) {
                chatHistoryDOM.removeChild(chatHistoryDOM.lastChild);
            }
            sendBtn.disabled = true; sendBtn.textContent = '⏳';
            IS_GENERATING = true;
            await executeAiCall();
        }

        async function executeAiCall() {
            const responseIndex = messagesContext.length;
            const iaMessageDOM = renderMessage("", false, responseIndex, true);
            let fullResponse = "";
            let isFirstInteraction = (allChats[currentChatId] && allChats[currentChatId].title.startsWith("Novo Chat"));

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messagesContext,
                        temperature: 0.7, 
                        stream: true
                    })
                });

                if (!response.ok) throw new Error("Problema na resposta do servidor.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.substring(6));
                                const delta = data.choices[0].delta.content;
                                if (delta) {
                                    fullResponse += delta;
                                    iaMessageDOM.innerHTML = parseMarkdown(fullResponse);
                                    scrollToBottom();
                                }
                            } catch (e) {}
                        }
                    }
                }

                iaMessageDOM.classList.remove('typing-cursor');
                messagesContext.push({ role: "assistant", content: fullResponse });
                saveDB();

                if(iaMessageDOM.parentNode) chatHistoryDOM.removeChild(iaMessageDOM.parentNode);
                renderMessage(fullResponse, false, responseIndex);
                
                if(isFirstInteraction) {
                    generateAutoTitle(currentChatId);
                }

            } catch (error) {
                iaMessageDOM.classList.remove('typing-cursor');
                iaMessageDOM.innerHTML = `⚠️ Opa, deu um errinho aqui: ${error.message}.`;
            } finally {
                IS_GENERATING = false;
                sendBtn.disabled = false; sendBtn.textContent = 'Enviar';
                scrollToBottom(); userInput.focus();
            }
        }

        // --- 8. EVENTOS ---
        document.getElementById('new-chat-btn').addEventListener('click', createNewChat);
        sendBtn.addEventListener('click', sendMessage);
        
        userInput.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendMessage(); 
            }
        });
        
        userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });

        function initApp() {
            if(!currentChatId || !allChats[currentChatId]) { 
                const keys = Object.keys(allChats);
                if(keys.length > 0) { loadChat(keys[keys.length - 1]); } else { createNewChat(); }
            } else { 
                loadChat(currentChatId); 
            }
        }

        initApp();
    </script>
</body>
